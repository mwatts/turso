version = 1
purpose = "Deep Cypher regression and donor bug-fix scenarios"

[[scenario]]
id = "grafeo.regression.wrong-relationship-direction"
tiers = ["smoke", "deep"]
kind = "bug-regression"
area = "match"
fixture = "social"
expectation = "rows"
action = "query"
ordering = "unordered"
query = "MATCH (a:Person {id: 1})<-[:KNOWS]-(b) RETURN b.name"
expected_rows = []
[scenario.source]
name = "Grafeo"
repository = "https://github.com/GrafeoDB/grafeo"
revision = "4ebae02f06f8f0cbc57543f74b6ba06f259dbed3"
path = "tests/spec/lpg/cypher/regression.gtest"
case = "backward_arrow_wrong_direction"
license = "Apache-2.0"
adaptation = "fixture-adaptation"

[[scenario]]
id = "age.regression.zero-length-preserves-identity"
tiers = ["deep"]
kind = "regression"
area = "traversal"
fixture = "social"
expectation = "rows"
action = "query"
ordering = "ordered"
query = "MATCH (a:Person {id: 2})-[:KNOWS*0..0]->(b) RETURN a.name, b.name"
expected_rows = [["Grace", "Grace"]]
[scenario.source]
name = "Apache AGE"
repository = "https://github.com/apache/age"
revision = "6876abcab0a3281eb65a7e2a91238e0b5abfdea7"
path = "regress/sql/cypher_vle.sql"
case = "zero length VLE identity"
license = "Apache-2.0"
adaptation = "fixture-adaptation"

[[scenario]]
id = "sparrow.regression.missing-property-is-null"
tiers = ["deep"]
kind = "bug-regression"
