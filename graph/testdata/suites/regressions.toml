[[scenario]]
id = "grafeo.regression.optional-count-preserves-rows"
tiers = ["deep"]
kind = "bug-regression"
area = "aggregation"
fixture = "social"
expectation = "rows"
action = "query"
ordering = "ordered"
query = "MATCH (p:Person {id: 4}) OPTIONAL MATCH (p)-[:KNOWS]->(f:Person) RETURN p.name, count(f)"
expected_rows = [["Edsger", "0"]]
[scenario.source]
name = "Grafeo"
repository = "https://github.com/GrafeoDB/grafeo"
revision = "4ebae02f06f8f0cbc57543f74b6ba06f259dbed3"
path = "tests/spec/lpg/cypher/regression.gtest"
case = "optional_match_count_preserves_all_rows"
license = "Apache-2.0"
adaptation = "fixture-adaptation"

[[scenario]]
id = "turso.regression.constraint-index-drop-error"
tiers = ["deep"]
kind = "bug-regression"
area = "mutation"
fixture = "social"
expectation = "error"
action = "mutation"
ordering = "ordered"
query = "CREATE (:Person {id: 1, name: 'duplicate'})"
expected_error_contains = "UNIQUE constraint failed"
[scenario.source]
name = "Turso"
repository = "https://github.com/mwatts/turso"
revision = "07b0e8988f6a1c3e04dbc3ffb97ff598c253e6f5"
path = "core/translate/index.rs"
case = "preserve constraint index drop errors"
license = "MIT"
adaptation = "behavioral-reference"
fixed_commit = "07b0e8988f6a1c3e04dbc3ffb97ff598c253e6f5"
