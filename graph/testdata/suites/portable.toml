version = 1
purpose = "Portable Cypher donor cases adapted to the shared social fixture"

[[scenario]]
id = "grafeo.match.incoming-edge"
tiers = ["deep"]
kind = "conformance"
area = "match"
fixture = "social"
expectation = "rows"
action = "query"
ordering = "unordered"
query = "MATCH (a:Person)<-[:KNOWS]-(b:Person) RETURN a.name, b.name"
expected_rows = [["Grace", "Ada"], ["Linus", "Ada"], ["Linus", "Grace"]]
[scenario.source]
name = "Grafeo"
repository = "https://github.com/GrafeoDB/grafeo"
revision = "4ebae02f06f8f0cbc57543f74b6ba06f259dbed3"
path = "tests/spec/lpg/cypher/reading_clauses.gtest"
case = "match_edge_incoming"
license = "Apache-2.0"
adaptation = "fixture-adaptation"

