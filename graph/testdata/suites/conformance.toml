version = 1
purpose = "Executable mixed-source Cypher conformance matrix"

[[scenario]]
id = "tck.with.with1.scenario-1"
tiers = ["smoke", "deep"]
kind = "conformance"
area = "scope"
fixture = "social"
expectation = "rows"
action = "query"
ordering = "ordered"
query = "MATCH (n:Person {id: 1}) WITH n RETURN n.name"
expected_rows = [["Ada"]]
[scenario.source]
name = "openCypher TCK via Uni"
repository = "https://github.com/rustic-ai/uni-db"
revision = "0812a496c62769b67cf688930750ae384e3de68d"
path = "crates/uni-tck/tck/features/clauses/with/With1.feature"
case = "Scenario [1]: Forwarding a node variable 1"
license = "Apache-2.0"
adaptation = "fixture-adaptation"

