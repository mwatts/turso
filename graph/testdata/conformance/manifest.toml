version = 1
purpose = "Executable mixed-source Cypher conformance slice for Turso graph"

# These cases normalize behavior rather than copy donor test bodies. Supported
# cases execute end-to-end. Unsupported cases must fail at the frontend boundary
# and remain visible in the generated compatibility report.

[[scenario]]
id = "tck-with-node-scope"
feature = "WITH scope"
status = "supported"
action = "query"
ordering = "ordered"
query = "MATCH (n:Person {id: 1}) WITH n RETURN n.name"
expected_rows = [["Ada"]]
source = "openCypher TCK via Uni"
source_repo = "https://github.com/rustic-ai/uni-db"
revision = "0812a496c62769b67cf688930750ae384e3de68d"
source_path = "crates/uni-tck/tck/features/clauses/with/With1.feature"
source_case = "Scenario [1]: Forwarind a node variable 1"
license = "Apache-2.0"

[[scenario]]
id = "grafeo-directed-edge"
feature = "directed fixed pattern"
status = "supported"
action = "query"
ordering = "unordered"
query = "MATCH (a:Person {id: 1})-[:KNOWS]->(b) RETURN b.name"
expected_rows = [["Grace"], ["Linus"]]
source = "Grafeo"
source_repo = "https://github.com/GrafeoDB/grafeo"
revision = "4ebae02f06f8f0cbc57543f74b6ba06f259dbed3"
source_path = "tests/spec/lpg/cypher/reading_clauses.gtest"
source_case = "match_edge_outgoing"
license = "Apache-2.0"

[[scenario]]
