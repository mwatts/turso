[package]
name = "turso_graph_frontend"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cypher preparation and graph query orchestration for Turso"

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
parking_lot = { workspace = true }
regex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror = { workspace = true }
tracing = { workspace = true }
turso_core = { workspace = true }
turso_ext = { workspace = true, features = ["core_only"] }
turso_graph_cypher = { workspace = true }
turso_graph_ir = { workspace = true }
turso_graph_runtime = { workspace = true }
turso_graph_temporal = { workspace = true }
turso_parser = { workspace = true }

[dev-dependencies]
divan.workspace = true
tempfile = { workspace = true }
toml = { workspace = true }
turso_macros.workspace = true

[[bench]]
name = "semantic_prepare"
harness = false
