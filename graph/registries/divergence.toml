[[entry]]
id = "apache-age.is_valid_label_name"
vendor = "Apache AGE"
area = "vendor-function"
reason = "AGE exposes its label-name validator as the runtime SQL predicate `ag_catalog.is_valid_label_name(name)`. Turso validates label names when it binds a query and reports an error there, so the check has no runtime callable form to test."
tests = [
    "age.expr.query-1000",
    "age.expr.query-998",
    "age.expr.query-999",
    "age.name.validation.query-10",
    "age.name.validation.query-5",
    "age.name.validation.query-6",
    "age.name.validation.query-7",
    "age.name.validation.query-8",
    "age.name.validation.query-9",
]

[[entry]]
id = "apache-age.vertex_stats"
vendor = "Apache AGE"
area = "vendor-function"
reason = "AGE exposes per-vertex catalog statistics as the SQL function `ag_catalog.vertex_stats(graph, label)`. Turso has no `ag_catalog` schema and no AGE-shaped statistics surface; graph statistics are reached through the Turso catalog instead. Implementing the function would mean adopting AGE's catalog layout, not a Cypher behavior."
tests = [
    "age.age.global.graph.query-16",
