version = 1

[[entry]]
id = "apache-age.delete_global_graphs"
vendor = "Apache AGE"
area = "vendor-function"
reason = "AGE administers globally registered graphs through `ag_catalog.delete_global_graphs(graph)`. Turso registers graphs per database and drops them through the Turso catalog, so there is no global namespace for this function to operate on."
tests = [
    "age.age.global.graph.query-10",
    "age.age.global.graph.query-11",
    "age.age.global.graph.query-12",
    "age.age.global.graph.query-13",
